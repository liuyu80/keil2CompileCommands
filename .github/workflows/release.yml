name: Build Windows Executable
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  id-token: write
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install Python
        uses: actions/setup-python@v1
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install requirements and installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install json5 pyinstaller
      - name: Run pyinstaller
        env:
          K2C_VERSION: ${{ github.ref_name }}
        run: |
          python -m PyInstaller k2c.spec
      - run: ls dist
      - run: mv dist/k2c.exe .
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\k2c.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  k2c.exe" | Out-File -Encoding ascii k2c.exe.sha256
          $version = "${{ github.ref_name }}".TrimStart("v")
          $manifest = Get-Content .\scoop\k2c.json.template -Raw
          $manifest = $manifest.Replace('$version', $version)
          $manifest = $manifest.Replace('$sha256', $hash)
          $manifest | Out-File -Encoding utf8 .\k2c.json
      - run: ls .
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v5
        env:
            GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          body: ${{steps.github_release.outputs.changelog}}
          files: |
            ./k2c.exe
            ./k2c.exe.sha256
            ./k2c.json
      - name: Build Python package
        run: |
          python -m pip install build
          python -m build
      - name: Publish Python package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish Scoop manifest to bucket
        if: vars.SCOOP_BUCKET_REPO != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Host "SCOOP_BUCKET_TOKEN is not configured; skipping bucket publish."
            exit 0
          }
          git clone "https://x-access-token:$env:GH_TOKEN@github.com/$env:SCOOP_BUCKET_REPO.git" scoop-bucket
          New-Item -ItemType Directory -Force -Path scoop-bucket\bucket | Out-Null
          Copy-Item .\k2c.json scoop-bucket\bucket\k2c.json
          Set-Location scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket\k2c.json
          git commit -m "k2c ${{ github.ref_name }}" || exit 0
          git push
